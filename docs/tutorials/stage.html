<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Piping ISO Suite tutorial stage</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: Inter, "Segoe UI", sans-serif; font-size: 12px; color: #1f2329; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #dfe3e8; }

  /* Revit chrome */
  .revit { position: absolute; inset: 0; display: flex; flex-direction: column; background: #f5f6f7; }
  .titlebar { height: 28px; display: flex; align-items: center; padding: 0 10px; gap: 10px; background: #2a3138; color: #e8ebee; font-size: 12px; }
  .titlebar .logo { width: 18px; height: 18px; border-radius: 3px; background: #1868c9; color: #fff; font-weight: 800; font-size: 11px; display: grid; place-items: center; }
  .titlebar .qat { display: flex; gap: 6px; opacity: .7; }
  .titlebar .qat i { width: 14px; height: 14px; border-radius: 2px; background: #59636e; display: block; }
  .titlebar .title { flex: 1; text-align: center; opacity: .9; }
  .tabs { height: 26px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: #e9ecef; border-bottom: 1px solid #c8cdd3; }
  .tabs .tab { padding: 5px 11px; font-size: 12px; color: #3a424b; border: 1px solid transparent; border-bottom: none; border-radius: 3px 3px 0 0; }
  .tabs .tab.file { background: #1868c9; color: #fff; font-weight: 600; }
  .tabs .tab.active { background: #f9fafb; border-color: #c8cdd3; color: #11161b; font-weight: 600; margin-bottom: -1px; }
  .ribbon { height: 94px; display: flex; padding: 4px 6px 0; gap: 6px; background: #f9fafb; border-bottom: 1px solid #c8cdd3; }
  .rpanel { display: flex; flex-direction: column; border-right: 1px solid #d5d9de; padding-right: 6px; }
  .rpanel .items { flex: 1; display: flex; gap: 2px; align-items: flex-start; }
  .rpanel .ptitle { text-align: center; font-size: 11px; color: #5b636d; background: #eceff2; margin: 0 -6px 0 0; padding: 2px 0; }
  .rbtn { width: 62px; height: 70px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px; border: 1px solid transparent; border-radius: 3px; text-align: center; font-size: 11px; line-height: 1.15; color: #20262c; white-space: pre-line; }
  .rbtn .ic { width: 32px; height: 32px; border-radius: 5px; color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; }
  .rbtn.ghost .ic { background: #c9ced5 !important; }
  .rbtn.ghost { color: #59616b; }
  .rsep { width: 1px; background: #dde1e5; margin: 6px 3px 10px; }
  .body { flex: 1; display: flex; min-height: 0; }
  .statusbar { height: 22px; display: flex; align-items: center; padding: 0 10px; font-size: 11px; color: #4a525c; background: #e9ecef; border-top: 1px solid #c8cdd3; }

  /* Properties palette */
  .props { width: 220px; display: flex; flex-direction: column; background: #fbfbfc; border-right: 1px solid #c8cdd3; }
  .phead { padding: 5px 8px; font-weight: 600; background: #e9ecef; border-bottom: 1px solid #d5d9de; }
  .ptype { margin: 6px; padding: 6px; border: 1px solid #d5d9de; background: #fff; font-size: 11px; }
  .prow { display: grid; grid-template-columns: 96px 1fr; border-bottom: 1px solid #eceef1; font-size: 11px; }
  .prow > div { padding: 4px 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .prow > div:first-child { color: #59616b; background: #f4f5f7; }
  .pgroup { padding: 4px 6px; font-weight: 600; font-size: 11px; background: #eef0f3; border-bottom: 1px solid #e2e5e9; }

  /* View */
  .view { flex: 1; position: relative; background: #fff; border-right: 1px solid #c8cdd3; min-width: 0; }
  .vtab { position: absolute; top: 0; left: 0; right: 0; height: 24px; display: flex; background: #e9ecef; border-bottom: 1px solid #d5d9de; }
  .vtab div { padding: 5px 12px; background: #fff; border-right: 1px solid #d5d9de; font-size: 11px; font-weight: 600; }
  .view svg { position: absolute; top: 24px; left: 0; }
  .viewcube { position: absolute; right: 14px; top: 36px; width: 54px; height: 54px; opacity: .8; }

  /* Dockable pane */
  .pane { width: 440px; display: flex; flex-direction: column; background: #fff; }
  .pane .phdr { height: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; background: #3b4651; color: #fff; font-size: 12px; font-weight: 600; }
  .pane .inner { flex: 1; display: flex; flex-direction: column; padding: 8px; min-height: 0; }
  .tc { display: flex; gap: 2px; border-bottom: 1px solid #c9ced6; }
  .tc div { padding: 4px 12px; border: 1px solid #c9ced6; border-bottom: none; background: #eef0f3; border-radius: 3px 3px 0 0; }
  .tc div.on { background: #fff; margin-bottom: -1px; font-weight: 600; }
  .tbody { flex: 1; border: 1px solid #c9ced6; border-top: none; padding: 6px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .combo { flex: 1; height: 22px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border: 1px solid #b9bfc8; background: #fff; }
  .combo:after { content: "▾"; color: #59616b; }
  .btn { display: inline-block; padding: 3px 8px; margin: 0 4px 4px 0; border: 1px solid #c9ced6; background: #f2f4f7; border-radius: 2px; font-size: 11.5px; white-space: nowrap; }
  .btn.primary { background: #2f6fb3; border-color: #245a93; color: #fff; }
  .btn.hover { background: #e2e9f2; border-color: #7aa7d6; }
  .btn.primary.hover { background: #3b7cc2; }
  .pressed { filter: brightness(.82); }
  .wrap { display: flex; flex-wrap: wrap; }
  .tbody .wrap .btn { margin-bottom: 3px; padding: 2px 7px; }
  .tbody .row { margin-bottom: 4px; }
  .search { height: 22px; padding: 3px 6px; margin: 1px 0 4px; }
  .search { position: relative; height: 24px; border: 1px solid #b9bfc8; margin: 2px 0 6px; padding: 4px 6px; }
  .search .ph { color: #9aa1ac; }
  .tree { flex: 1; overflow: hidden; border: 1px solid #d5d9de; padding: 3px 2px; font-size: 11px; }
  .tn { display: flex; align-items: center; height: 18px; white-space: nowrap; border-radius: 2px; padding-right: 4px; }
  .tn.sel { background: #cde4fb; }
  .tn .ex { width: 12px; color: #6b737d; font-size: 9px; text-align: center; }
  .cb { width: 13px; height: 13px; border: 1px solid #8c939d; border-radius: 2px; margin: 0 4px 0 2px; background: #fff; font-size: 10px; line-height: 11px; text-align: center; color: #fff; }
  .cb.on { background: #2f6fb3; border-color: #2f6fb3; }
  .badge { padding: 0 4px; border-radius: 3px; color: #fff; font-size: 9.5px; font-weight: 700; margin-right: 6px; }
  .tn .tx { font-weight: 600; }
  .tn .dt { color: #7a818c; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; }
  .split { height: 5px; background: #e3e6eb; margin: 3px 0; }
  .issues-l { color: #4a5260; margin: 2px 0; }
  .issues { height: 44px; flex: none; border: 1px solid #d5d9de; overflow: hidden; font-size: 11px; }
  .issue { display: flex; padding: 2px 4px; gap: 6px; }
  .issue.sel { background: #cde4fb; }
  .issue b { width: 70px; flex: none; color: #c0504d; }
  .pstatus { margin-top: 5px; color: #4a5260; font-size: 11.5px; white-space: pre-line; min-height: 28px; }
  .settings { flex: 1; overflow: hidden; position: relative; }
  .settings .sc { position: absolute; left: 0; right: 4px; top: 0; }
  .sec { font-weight: 600; font-size: 13px; margin: 12px 0 2px; }
  .lbl { color: #4a5260; margin: 7px 0 2px; font-size: 11px; }
  .fld { height: 22px; border: 1px solid #b9bfc8; padding: 3px 5px; font-size: 11.5px; white-space: nowrap; overflow: hidden; background: #fff; }
  .fld.focus { border-color: #2f6fb3; box-shadow: 0 0 0 1px #2f6fb3; }
  .caret { display: inline-block; width: 1px; height: 13px; background: #111; vertical-align: -2px; }
  .chk { display: flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 11.5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }

  /* Dialogs */
  .modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20, 26, 33, .18); }
  .dlg { width: 430px; background: #fff; border: 1px solid #8f98a3; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .dlg .dh { padding: 7px 10px; font-weight: 600; border-bottom: 1px solid #e1e4e8; }
  .dlg .db { padding: 16px 14px; font-size: 13px; line-height: 1.45; white-space: pre-line; }
  .dlg .df { padding: 10px; display: flex; justify-content: flex-end; gap: 6px; background: #f2f4f6; border-top: 1px solid #e1e4e8; }
  .dlg .df .btn { padding: 4px 18px; margin: 0; }

  /* Overlays */
  #caption { position: absolute; z-index: 40; left: 50%; bottom: 34px; transform: translateX(-50%); max-width: 940px; padding: 10px 18px; border-radius: 8px; background: rgba(14, 20, 28, .86); color: #fff; font-size: 17px; line-height: 1.4; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #cursor { position: absolute; width: 22px; height: 22px; pointer-events: none; z-index: 50; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid #ff9f1a; pointer-events: none; z-index: 49; }
  .focus-ring { position: absolute; border: 3px solid #ff9f1a; border-radius: 6px; pointer-events: none; z-index: 48; box-shadow: 0 0 0 4px rgba(255,159,26,.25); }
  .callout { position: absolute; z-index: 47; background: #ff9f1a; color: #1d1300; font-weight: 700; font-size: 12px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
  .card { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: center; padding: 0 110px; color: #fff;
          background: radial-gradient(1200px 600px at 80% 20%, #2f6fb3 0%, #173a63 45%, #0d1b2c 100%); }
  .card .k { font-size: 16px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  .card .n { margin-top: 26px; display: inline-block; align-self: flex-start; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,.14); font-size: 15px; }
  .card h1 { margin-top: 14px; font-size: 54px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; }
  .card p { margin-top: 16px; font-size: 21px; opacity: .85; max-width: 900px; line-height: 1.4; }
  .card .pipes { position: absolute; right: 70px; bottom: 60px; opacity: .25; }

  /* Windows desktop / installer */
  .desk { position: absolute; inset: 0; background: radial-gradient(900px 500px at 30% 40%, #3d7fd1 0%, #1b4c8f 50%, #0d2550 100%); }
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: rgba(240,243,247,.92); display: flex; justify-content: center; align-items: center; gap: 10px; }
  .taskbar i { width: 24px; height: 24px; border-radius: 5px; background: #8fa3bd; display: block; }
  .taskbar i.win { background: linear-gradient(135deg, #3aa0ff, #0067c0); }
  .explorer { position: absolute; left: 140px; top: 90px; width: 620px; height: 380px; background: #fff; border-radius: 8px; box-shadow: 0 16px 50px rgba(0,0,0,.45); overflow: hidden; }
  .explorer .eh { height: 34px; display: flex; align-items: center; padding: 0 12px; background: #f3f5f8; border-bottom: 1px solid #e1e4e8; font-weight: 600; }
  .explorer .ep { display: flex; height: calc(100% - 34px); }
  .explorer .side { width: 150px; background: #f8f9fb; border-right: 1px solid #eceef1; padding: 10px; color: #505862; line-height: 2; }
  .explorer .files { flex: 1; padding: 14px; }
  .file { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; }
  .file.sel { background: #cfe3fa; }
  .file .fi { width: 30px; height: 34px; border-radius: 3px; background: linear-gradient(160deg, #4e8fdc, #1d5aa6); color: #fff; font-weight: 800; font-size: 10px; display: grid; place-items: center; }
  .smart { position: absolute; left: 330px; top: 120px; width: 620px; height: 400px; background: #0067b8; color: #fff; padding: 34px 40px; box-shadow: 0 16px 50px rgba(0,0,0,.5); }
  .smart h2 { font-size: 30px; font-weight: 400; }
  .smart p { margin-top: 18px; font-size: 14px; line-height: 1.5; }
  .smart .lnk { text-decoration: underline; margin-top: 14px; display: inline-block; font-size: 14px; }
  .smart .sbtns { position: absolute; right: 30px; bottom: 26px; display: flex; gap: 8px; }
  .smart .sbtns div { padding: 7px 20px; border: 2px solid #fff; font-size: 14px; }
  .wiz { position: absolute; left: 290px; top: 100px; width: 700px; height: 500px; background: #fff; box-shadow: 0 16px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; border: 1px solid #7a8794; }
  .wiz .wt { height: 30px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #e1e4e8; }
  .wiz .wh { padding: 18px 26px; border-bottom: 1px solid #e1e4e8; display: flex; justify-content: space-between; }
  .wiz .wh b { font-size: 15px; display: block; }
  .wiz .wh span { color: #505862; display: block; margin-top: 4px; font-size: 13px; }
  .wiz .wico { width: 54px; height: 54px; border-radius: 8px; background: linear-gradient(160deg, #4e8fdc, #1d5aa6); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 15px; }
  .wiz .wb { flex: 1; padding: 22px 26px; font-size: 13px; line-height: 1.5; }
  .wiz .memo { margin-top: 14px; border: 1px solid #b9bfc8; height: 140px; padding: 8px; font-family: "DejaVu Sans Mono", monospace; font-size: 12px; white-space: pre; }
  .wiz .wf { height: 56px; border-top: 1px solid #e1e4e8; background: #f3f5f8; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 0 18px; }
  .wiz .wf .btn { padding: 5px 20px; margin: 0; font-size: 13px; }
  .bar { height: 18px; border: 1px solid #b9bfc8; margin-top: 18px; }
  .bar div { height: 100%; background: #23a559; }
  .mode { position: absolute; left: 400px; top: 170px; width: 480px; background: #fff; box-shadow: 0 16px 50px rgba(0,0,0,.5); border: 1px solid #7a8794; }
  .mode .mb { padding: 20px 22px; font-size: 13px; line-height: 1.5; }
  .mode .opt { margin-top: 12px; padding: 12px 14px; border: 1px solid #c9ced6; border-radius: 3px; font-size: 13px; }
  .mode .opt b { display: block; color: #1a5fb4; font-size: 14px; }

  /* CSV preview */
  .sheetwin { position: absolute; left: 40px; top: 70px; right: 40px; background: #fff; border: 1px solid #8f98a3; box-shadow: 0 16px 50px rgba(0,0,0,.35); overflow: hidden; z-index: 30; }
  .sheetwin .eh { height: 30px; display: flex; align-items: center; padding: 0 12px; color: #fff; background: #1e7145; font-weight: 600; }
  .csv { border-collapse: collapse; font-size: 11px; }
  .csv td { border: 1px solid #d9dde2; padding: 3px 6px; white-space: nowrap; }
  .csv tr:first-child td { background: #e8f1ea; font-weight: 700; }
  .csv td.rh { background: #f2f4f6; color: #7a818c; text-align: center; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="engine.js"></script>
</body>
</html>
